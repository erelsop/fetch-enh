name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "Node ${{ matrix.node }} on ${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        # Full Node matrix on Linux; Node 22 spot-check on Windows and macOS.
        node: [20, 22]
        os: [ubuntu-latest]
        include:
          - node: 22
            os: windows-latest
          - node: 22
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (CJS + ESM)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check coverage thresholds
        run: npm run test:coverage

      - name: Smoke-test CJS artifact (behaviour)
        run: |
          node -e "
          const http = require('http');
          const FetchEnh = require('./dist/index.js').default;
          (async () => {
            const server = http.createServer((req, res) => {
              const chunks = [];
              req.on('data', c => chunks.push(c));
              req.on('end', () => {
                res.writeHead(200, { 'content-type': 'application/json' });
                res.end(JSON.stringify({ method: req.method, body: Buffer.concat(chunks).toString() }));
              });
            });
            await new Promise(r => server.listen(0, '127.0.0.1', r));
            const port = server.address().port;
            const api = new FetchEnh({ baseURL: 'http://127.0.0.1:' + port, defaultRetries: 0 });
            const r1 = await api.get({ endpoint: '/x' });
            console.log('CJS GET ok:', JSON.stringify(r1));
            const r2 = await api.post({ endpoint: '/x', body: { hi: 'there' } });
            console.log('CJS POST ok:', JSON.stringify(r2));
            const r3 = await api.raw({ endpoint: '/x', method: 'POST', body: { a: 1 } });
            console.log('CJS RAW POST ok: status', r3.status);
            server.close();
            console.log('CJS behaviour smoke-test passed');
          })().catch(err => { console.error('CJS smoke-test failed:', err.message); process.exit(1); });
          "

      - name: Smoke-test ESM artifact (behaviour)
        run: |
          node --input-type=module <<'EOF'
          import http from 'node:http';
          import { pathToFileURL } from 'node:url';
          const esmEntry = new URL('dist/esm/index.js', pathToFileURL(process.cwd() + '/'));
          const { default: FetchEnh } = await import(esmEntry.href);
          const server = http.createServer((req, res) => {
            const chunks = [];
            req.on('data', c => chunks.push(c));
            req.on('end', () => {
              res.writeHead(200, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ method: req.method, body: Buffer.concat(chunks).toString() }));
            });
          });
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const port = server.address().port;
          const api = new FetchEnh({ baseURL: 'http://127.0.0.1:' + port, defaultRetries: 0 });
          const r1 = await api.get({ endpoint: '/x' });
          console.log('ESM GET ok:', JSON.stringify(r1));
          const r2 = await api.post({ endpoint: '/x', body: { hi: 'there' } });
          console.log('ESM POST ok:', JSON.stringify(r2));
          const r3 = await api.raw({ endpoint: '/x', method: 'POST', body: { a: 1 } });
          console.log('ESM RAW POST ok: status', r3.status);
          server.close();
          console.log('ESM behaviour smoke-test passed');
          EOF
