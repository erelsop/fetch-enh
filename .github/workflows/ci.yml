name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "Node ${{ matrix.node }} — test + build"
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (CJS + ESM)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Smoke-test CJS artifact
        run: node -e "const m = require('./dist/index.js'); console.log('CJS ok, default export:', typeof m.default);"

      - name: Smoke-test ESM artifact
        run: |
          node --input-type=module <<'EOF'
          import { createRequire } from 'module';
          import { pathToFileURL } from 'url';
          const esmEntry = new URL('dist/esm/index.js', pathToFileURL(process.cwd() + '/'));
          const m = await import(esmEntry.href);
          console.log('ESM ok, default export:', typeof m.default);
          EOF
